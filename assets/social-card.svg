<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">System Design Atlas</title>
  <desc id="desc">Five visual tracks for backend, systems engineering, hardware, embedded, and ACiM NPU interviews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#10233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#63d5ed"/>
      <stop offset=".52" stop-color="#68a7ff"/>
      <stop offset="1" stop-color="#b69cff"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#68a7ff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1070" cy="90" r="240" fill="#63d5ed" opacity=".07"/>
  <rect x="78" y="70" width="58" height="58" rx="14" fill="#68a7ff"/>
  <text x="107" y="107" text-anchor="middle" fill="#07111f" font-family="ui-monospace, monospace" font-size="20" font-weight="800">SD</text>
  <text x="158" y="108" fill="#eef5ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">System Design Atlas</text>
  <text x="78" y="245" fill="#eef5ff" font-family="system-ui, sans-serif" font-size="68" font-weight="800">Choose the boundary.</text>
  <text x="78" y="326" fill="url(#accent)" font-family="system-ui, sans-serif" font-size="68" font-weight="800">Then choose the method.</text>
  <text x="78" y="390" fill="#9fb0c5" font-family="system-ui, sans-serif" font-size="27">Visual reasoning, bottlenecks, trade-offs, and interview practice.</text>
  <g font-family="ui-monospace, monospace" font-size="20" font-weight="700">
    <rect x="78" y="465" width="183" height="54" rx="27" fill="#122238" stroke="#68a7ff" stroke-opacity=".45"/><text x="169" y="499" text-anchor="middle" fill="#9bc5ff">BACKEND</text>
    <rect x="277" y="465" width="183" height="54" rx="27" fill="#122238" stroke="#69d6b1" stroke-opacity=".45"/><text x="369" y="499" text-anchor="middle" fill="#69d6b1">SYSTEMS</text>
    <rect x="476" y="465" width="183" height="54" rx="27" fill="#122238" stroke="#f3b451" stroke-opacity=".45"/><text x="568" y="499" text-anchor="middle" fill="#f3b451">HARDWARE</text>
    <rect x="675" y="465" width="183" height="54" rx="27" fill="#122238" stroke="#63d5ed" stroke-opacity=".45"/><text x="767" y="499" text-anchor="middle" fill="#63d5ed">EMBEDDED</text>
    <rect x="874" y="465" width="210" height="54" rx="27" fill="#122238" stroke="#b69cff" stroke-opacity=".45"/><text x="979" y="499" text-anchor="middle" fill="#b69cff">NPU + ACiM</text>
  </g>
</svg>
